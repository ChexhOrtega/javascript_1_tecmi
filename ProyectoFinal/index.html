<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="css/estilos.css" />
    <title>Presupuestos</title>
  </head>

  <body onload="cargarApp()">
    <div class="cabecero">
      <div class="presupuesto">
        <div class="presupuesto_titulo">Presupuesto Disponible</div>
        <div id="presupuesto" class="presupuesto_valor"></div>
        <div class="presupuesto_ingreso limpiarEstilos">
          <div class="presupuesto_ingreso--texto">Ingresos</div>
          <div class="derecha">
            <div id="ingresos" class="presupuesto_ingreso--valor"></div>
            <div class="presupuesto_ingreso--porcentaje"></div>
          </div>
        </div>
        <div class="presupuesto_egreso limpiarEstilos">
          <div class="presupuesto_egreso--texto">Egresos</div>
          <div class="derecha limpiarEstilos">
            <div id="egresos" class="presupuesto_egreso--valor"></div>
            <div id="porcentaje" class="presupuesto_egreso--porcentaje"></div>
          </div>
        </div>
      </div>
    </div>

    <div>
      <form id="forma" onsubmit="return false;">
        <div class="agregar">
          <div class="agregar_contenedor">
            <select class="agregar_tipo" id="tipo">
              <option value="ingreso" selected>+</option>
              <option value="egreso">-</option>
            </select>
            <input
              type="text"
              class="agregar_descripcion"
              placeholder="Agregar Descripción"
              id="descripcion"
            />
            <input
              type="numeric"
              class="agregar_valor"
              placeholder="Valor"
              step="any"
              id="valor"
            />
            <button class="agregar_btn" onclick="agregarDato()">
              <ion-icon name="checkmark-circle-outline" />
            </button>
          </div>
        </div>
      </form>
    </div>

    <div class="contenedor limpiarEstilos">
      <div class="ingreso">
        <h2 class="ingreso_titulo">Ingresos</h2>
        <div id="lista-ingresos"></div>
      </div>

      <div class="egreso">
        <h2 class="egreso_titulo">Egresos</h2>
        <div id="lista-egresos"></div>
      </div>
    </div>

    <footer class="footer">
      <p>&copy; <span id="anio-actual"></span> César Ortega</p>
    </footer>

    <script>
      document.getElementById("anio-actual").textContent =
        new Date().getFullYear();
    </script>

    <script
      type="module"
      src="https://unpkg.com/ionicons@5.4.0/dist/ionicons/ionicons.esm.js"
    ></script>
  </body>

  <script type="text/javascript" src="js/Dato.js"></script>
  <script type="text/javascript" src="js/Ingreso.js"></script>
  <script type="text/javascript" src="js/Egreso.js"></script>
  <script type="text/javascript" src="js/app.js"></script>
</html>
